name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1 pin: v4.1.0 strict-lockfile resolution breaks make=latest (2026-06-04)

      - name: Run prek
        run: prek run --all-files
        env:
          TREEFMT_CI: true # Don't use formatter cache
